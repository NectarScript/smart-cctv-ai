<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart CCTV AI — Dashboard</title>
<style>
  :root {
    --bg: #0a0e17;
    --card: #111827;
    --border: #1f2937;
    --text: #e5e7eb;
    --muted: #6b7280;
    --accent: #3b82f6;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .topbar h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .topbar h1 span { color: var(--accent); }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .status-pill.live {
    background: rgba(34, 197, 94, 0.15);
    color: var(--green);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 16px;
    padding: 16px 24px;
    max-height: calc(100vh - 57px);
  }

  .feed-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .feed-container {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    aspect-ratio: 4/3;
  }

  .feed-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .feed-label {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.7);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    backdrop-filter: blur(8px);
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.2;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-top: 4px;
  }

  .stat-value.fps { color: var(--green); }
  .stat-value.tracks { color: var(--accent); }
  .stat-value.alerts { color: var(--red); }
  .stat-value.alerts.clear { color: var(--green); }
  .stat-value.latency { color: var(--yellow); }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    max-height: 300px;
  }

  .event-item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    font-size: 13px;
  }

  .event-item:last-child { border-bottom: none; }

  .event-time {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }

  .event-detail {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .event-type {
    font-weight: 600;
    font-size: 13px;
  }

  .event-meta {
    font-size: 11px;
    color: var(--muted);
  }

  .severity-badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .severity-badge.suspicious {
    background: rgba(245, 158, 11, 0.15);
    color: var(--yellow);
  }

  .severity-badge.critical {
    background: rgba(239, 68, 68, 0.15);
    color: var(--red);
  }

  .perf-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
  }

  .perf-item {
    background: var(--card);
    padding: 12px 16px;
    text-align: center;
  }

  .perf-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .perf-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .empty-state {
    padding: 30px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .legend {
    display: flex;
    gap: 16px;
    padding: 12px 16px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-dot.normal { background: var(--green); }
  .legend-dot.suspicious { background: var(--yellow); }
  .legend-dot.critical { background: var(--red); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  @media (max-width: 1024px) {
    .main {
      grid-template-columns: 1fr;
      max-height: none;
    }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">&#x1F441;</div>
    <h1>Smart <span>CCTV</span> AI</h1>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div style="display:flex;gap:8px">
      <a href="/" style="padding:6px 14px;border-radius:6px;font-size:13px;text-decoration:none;color:var(--text);background:var(--border);border:1px solid var(--border)">Live Feed</a>
      <a href="/upload" style="padding:6px 14px;border-radius:6px;font-size:13px;text-decoration:none;color:var(--muted);border:1px solid var(--border)">Video Analysis</a>
    </div>
    <div class="status-pill live">
      <div class="status-dot"></div>
      LIVE
    </div>
  </div>
</div>

<div class="main">
  <div class="feed-section">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value fps" id="stat-fps">--</div>
        <div class="stat-label">FPS</div>
      </div>
      <div class="stat-card">
        <div class="stat-value tracks" id="stat-tracks">--</div>
        <div class="stat-label">Active Tracks</div>
      </div>
      <div class="stat-card">
        <div class="stat-value alerts clear" id="stat-alerts">0</div>
        <div class="stat-label">Live Alerts</div>
      </div>
      <div class="stat-card">
        <div class="stat-value latency" id="stat-latency">--</div>
        <div class="stat-label">Latency (ms)</div>
      </div>
    </div>

    {% for cam in cameras %}
    <div class="feed-container">
      <img src="/video_feed/{{ cam }}" alt="Camera {{ cam }}">
      <div class="feed-label">{{ cam }}</div>
    </div>
    {% endfor %}
  </div>

  <div class="sidebar">
    <div class="panel">
      <div class="panel-header">
        Event Log
        <span id="event-count" style="color: var(--text);">0</span>
      </div>
      <div class="panel-body" id="event-list">
        <div class="empty-state">No events detected yet</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">Pipeline Performance</div>
      <div class="perf-grid">
        <div class="perf-item">
          <div class="perf-value" id="perf-detect">--</div>
          <div class="perf-label">Detection</div>
        </div>
        <div class="perf-item">
          <div class="perf-value" id="perf-track">--</div>
          <div class="perf-label">Tracking</div>
        </div>
        <div class="perf-item">
          <div class="perf-value" id="perf-pose">--</div>
          <div class="perf-label">Pose Est.</div>
        </div>
        <div class="perf-item">
          <div class="perf-value" id="perf-total">--</div>
          <div class="perf-label">Total</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">Legend</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot normal"></div> Normal</div>
        <div class="legend-item"><div class="legend-dot suspicious"></div> Suspicious</div>
        <div class="legend-item"><div class="legend-dot critical"></div> Critical</div>
      </div>
    </div>
  </div>
</div>

<script>
function updateStats() {
  fetch('/api/stats')
    .then(r => r.json())
    .then(data => {
      document.getElementById('stat-fps').textContent = data.fps || '--';
      document.getElementById('stat-tracks').textContent = data.tracks || '0';

      const alertEl = document.getElementById('stat-alerts');
      alertEl.textContent = data.alerts || '0';
      alertEl.className = 'stat-value alerts' + (data.alerts > 0 ? '' : ' clear');

      const totalMs = (data.detect_ms || 0) + (data.track_ms || 0) + (data.pose_ms || 0);
      document.getElementById('stat-latency').textContent = totalMs.toFixed(0);

      document.getElementById('perf-detect').textContent = (data.detect_ms || 0) + 'ms';
      document.getElementById('perf-track').textContent = (data.track_ms || 0) + 'ms';
      document.getElementById('perf-pose').textContent = (data.pose_ms || 0) + 'ms';
      document.getElementById('perf-total').textContent = totalMs.toFixed(0) + 'ms';
    })
    .catch(() => {});
}

function updateEvents() {
  fetch('/api/events')
    .then(r => r.json())
    .then(events => {
      const list = document.getElementById('event-list');
      document.getElementById('event-count').textContent = events.length;

      if (events.length === 0) {
        list.innerHTML = '<div class="empty-state">No events detected yet</div>';
        return;
      }

      const seen = new Set();
      let html = '';
      for (const e of events) {
        const key = e.time + e.track_id + e.event;
        if (seen.has(key)) continue;
        seen.add(key);

        html += `
          <div class="event-item">
            <div class="event-time">${e.time}</div>
            <div class="event-detail">
              <div class="event-type">${e.event.replace('_', ' ').toUpperCase()}</div>
              <div class="event-meta">Track #${e.track_id} &middot; ${e.camera} &middot; ${e.confidence}</div>
            </div>
            <div class="severity-badge ${e.severity}">${e.severity}</div>
          </div>`;
      }
      list.innerHTML = html;
    })
    .catch(() => {});
}

setInterval(updateStats, 1000);
setInterval(updateEvents, 2000);
updateStats();
updateEvents();
</script>
</body>
</html>
