<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart CCTV AI — Video Analysis</title>
<style>
  :root {
    --bg: #0a0e17;
    --card: #111827;
    --border: #1f2937;
    --text: #e5e7eb;
    --muted: #6b7280;
    --accent: #3b82f6;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .topbar h1 { font-size: 18px; font-weight: 600; }
  .topbar h1 span { color: var(--accent); }

  .nav-links { display: flex; gap: 8px; }
  .nav-links a {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    text-decoration: none;
    color: var(--muted);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .nav-links a:hover, .nav-links a.active {
    color: var(--text);
    background: var(--border);
  }

  .container { max-width: 900px; margin: 0 auto; padding: 32px 24px; }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 60px 40px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: var(--card);
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.05);
  }
  .upload-zone h2 { font-size: 20px; margin-bottom: 8px; }
  .upload-zone p { color: var(--muted); font-size: 14px; }
  .upload-zone .icon { font-size: 48px; margin-bottom: 16px; }
  .upload-zone input { display: none; }

  .file-info {
    display: flex; align-items: center; gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 16px;
  }
  .file-name { font-weight: 600; font-size: 14px; }
  .file-size { color: var(--muted); font-size: 12px; }
  .file-info .remove {
    margin-left: auto;
    background: none; border: none;
    color: var(--red); cursor: pointer;
    font-size: 18px;
  }

  .btn {
    padding: 10px 24px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
    margin-top: 16px;
  }
  .btn-primary:hover { background: #2563eb; }
  .btn-primary:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  .progress-section {
    margin-top: 24px;
    display: none;
  }
  .progress-section.visible { display: block; }
  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 12px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #8b5cf6);
    border-radius: 4px;
    transition: width 0.3s;
    width: 0%;
  }
  .progress-text {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }

  .results-section {
    margin-top: 32px;
    display: none;
  }
  .results-section.visible { display: block; }
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .results-header h3 { font-size: 16px; }

  .summary-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .summary-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .summary-value { font-size: 28px; font-weight: 700; }
  .summary-label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

  .event-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .event-table th {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
  }
  .event-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .severity-badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .severity-badge.suspicious { background: rgba(245,158,11,0.15); color: var(--yellow); }
  .severity-badge.critical { background: rgba(239,68,68,0.15); color: var(--red); }

  .empty-results {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }
  .empty-results .check { font-size: 48px; color: var(--green); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">&#x1F441;</div>
    <h1>Smart <span>CCTV</span> AI</h1>
  </div>
  <div class="nav-links">
    <a href="/">Live Feed</a>
    <a href="/upload" class="active">Video Analysis</a>
  </div>
</div>

<div class="container">
  <div class="upload-zone" id="dropzone">
    <div class="icon">&#128249;</div>
    <h2>Upload Video for Analysis</h2>
    <p>Drag & drop or click to select &mdash; MP4, AVI, MKV, MOV (max 500MB)</p>
    <input type="file" id="fileInput" accept="video/*">
  </div>

  <div id="fileInfo" style="display:none">
    <div class="file-info">
      <div>
        <div class="file-name" id="fileName"></div>
        <div class="file-size" id="fileSize"></div>
      </div>
      <button class="remove" id="removeFile">&times;</button>
    </div>
    <button class="btn btn-primary" id="analyzeBtn">Analyze Video</button>
  </div>

  <div class="progress-section" id="progressSection">
    <h3>Processing...</h3>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">Starting...</div>
  </div>

  <div class="results-section" id="resultsSection">
    <div class="results-header">
      <h3>Analysis Results</h3>
    </div>
    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-value" id="totalFrames" style="color:var(--accent)">0</div>
        <div class="summary-label">Frames Analyzed</div>
      </div>
      <div class="summary-card">
        <div class="summary-value" id="totalEvents" style="color:var(--yellow)">0</div>
        <div class="summary-label">Events Detected</div>
      </div>
      <div class="summary-card">
        <div class="summary-value" id="videoFps" style="color:var(--green)">0</div>
        <div class="summary-label">Video FPS</div>
      </div>
    </div>
    <div id="eventResults"></div>
  </div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const analyzeBtn = document.getElementById('analyzeBtn');
let selectedFile = null;

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) selectFile(fileInput.files[0]); });

document.getElementById('removeFile').addEventListener('click', () => {
  selectedFile = null;
  fileInfo.style.display = 'none';
  dropzone.style.display = 'block';
});

function selectFile(f) {
  selectedFile = f;
  document.getElementById('fileName').textContent = f.name;
  document.getElementById('fileSize').textContent = (f.size / (1024*1024)).toFixed(1) + ' MB';
  fileInfo.style.display = 'block';
  dropzone.style.display = 'none';
}

analyzeBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  analyzeBtn.disabled = true;
  analyzeBtn.textContent = 'Uploading...';

  const form = new FormData();
  form.append('video', selectedFile);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (data.error) { alert(data.error); analyzeBtn.disabled = false; analyzeBtn.textContent = 'Analyze Video'; return; }

    document.getElementById('progressSection').classList.add('visible');
    fileInfo.style.display = 'none';
    pollJob(data.job_id);
  } catch (err) {
    alert('Upload failed: ' + err.message);
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = 'Analyze Video';
  }
});

function pollJob(jobId) {
  const interval = setInterval(async () => {
    const res = await fetch('/api/job/' + jobId);
    const job = await res.json();

    if (job.total_frames > 0) {
      const pct = Math.round((job.progress / job.total_frames) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent =
        `Frame ${job.progress} / ${job.total_frames} (${pct}%)`;
    }

    if (job.status === 'done') {
      clearInterval(interval);
      document.getElementById('progressSection').classList.remove('visible');
      showResults(job);
    } else if (job.status === 'error') {
      clearInterval(interval);
      document.getElementById('progressText').textContent = 'Error: ' + job.error;
    }
  }, 1000);
}

function showResults(job) {
  const section = document.getElementById('resultsSection');
  section.classList.add('visible');

  document.getElementById('totalFrames').textContent = job.total_frames;
  document.getElementById('totalEvents').textContent = job.events.length;
  document.getElementById('videoFps').textContent = Math.round(job.fps);

  const container = document.getElementById('eventResults');

  if (job.events.length === 0) {
    container.innerHTML = `
      <div class="empty-results">
        <div class="check">&#10003;</div>
        <p style="margin-top:12px; font-size:16px">No suspicious activity detected</p>
        <p style="margin-top:4px">All tracked individuals showed normal behaviour throughout the video.</p>
      </div>`;
    return;
  }

  let rows = '';
  for (const e of job.events) {
    rows += `<tr>
      <td>${e.time}</td>
      <td>#${e.track_id}</td>
      <td>${e.event.replace(/_/g, ' ').toUpperCase()}</td>
      <td><span class="severity-badge ${e.severity}">${e.severity}</span></td>
      <td>${e.confidence}</td>
    </tr>`;
  }

  container.innerHTML = `
    <table class="event-table">
      <thead><tr>
        <th>Time</th><th>Track</th><th>Event</th><th>Severity</th><th>Confidence</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  // Reset upload for another video
  dropzone.style.display = 'block';
  analyzeBtn.disabled = false;
  analyzeBtn.textContent = 'Analyze Video';
  selectedFile = null;
}
</script>
</body>
</html>
