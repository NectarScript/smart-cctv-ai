# Smart CCTV AI — site configuration
# Edit this file to add cameras and zones. All thresholds live here, not in code.

app:
  name: "Smart CCTV AI"
  host: "0.0.0.0"
  port: 8000
  device: "cuda"            # "cuda" | "cpu" | "auto"
  log_level: "INFO"

detection:
  model: "yolo11n.pt"
  conf: 0.35
  iou: 0.5
  imgsz: 640
  tracker: "bytetrack.yaml"
  person_class: 0

behaviour:
  cooldown_seconds: 20
  intrusion:         { enabled: true }
  loitering:         { enabled: true, dwell_seconds: 10 }
  running:           { enabled: true, min_speed_hpersec: 2.5, window_seconds: 1.0 }
  fall:              { enabled: true, horizontal_angle_deg: 35, down_seconds: 1.5 }
  fighting:          { enabled: true, min_overlap_iou: 0.1, min_motion_px: 25 }
  crowd_surge:       { enabled: true, max_people: 5 }
  unattended_object: { enabled: true, stationary_seconds: 15, abandon_distance_px: 180 }
  pose:
    model: "yolo11n-pose.pt"
    conf: 0.3
    imgsz: 640
    every_n_frames: 2
    min_people_for_pose: 1

recorder:
  enabled: true
  pre_seconds: 4
  post_seconds: 6
  fps: 15

cameras:
  - id: "cam1"
    name: "Demo (sample video)"
    source: "samples/intrusion.mp4"
    fps: 15
    zones:
      - name: "restricted_A"
        polygon: [[100, 100], [540, 100], [540, 380], [100, 380]]
        rules: ["intrusion", "loitering", "crowd_surge"]

alerts:
  telegram:
    enabled: true           # fires only when TELEGRAM_BOT_TOKEN + chat_id present
    chat_id: ""             # or set TELEGRAM_CHAT_ID in .env
    min_severity: "suspicious"  # "normal" | "suspicious" | "critical"

vlm:
  enabled: true             # requires ollama running + the model below pulled
  model: "qwen2.5vl:7b"     # 6 GB VRAM; swap to qwen2.5vl:3b (~3.2 GB) if OOM
  ollama_url: "http://127.0.0.1:11434"
  timeout_seconds: 20       # 7b is slower; drop to 10 if using 3b
  verify_min_severity: "suspicious"
